name: voting-system
recipe: drupal11
config:
  webroot: web
  php: '8.4'
  database: mysql:8.4
  composer_version: '2-latest'

services:
  appserver:
    xdebug: true
    overrides:
      environment:
        XDEBUG_MODE: "off"

  # Serves the HTML coverage report
  coverage:
    type: nginx
    ssl: false
    webroot: coverage/html

proxy:
  coverage:
    - coverage.voting-system.lndo.site

tooling:
  phpunit:
    service: appserver
    cmd: ./vendor/bin/phpunit

  test-unit:
    service: appserver
    cmd: ./vendor/bin/phpunit --testsuite=Unit

  test-kernel:
    service: appserver
    cmd: ./vendor/bin/phpunit --testsuite=Kernel

  test-contract:
    service: appserver
    cmd: ./vendor/bin/phpunit --testsuite=Contract

  test-integration:
    service: appserver
    cmd: ./vendor/bin/phpunit --testsuite=Integration

  test-functional:
    service: appserver
    cmd: ./vendor/bin/phpunit --testsuite=Contract,Integration,Admin

  coverage:
    service: appserver
    cmd: env XDEBUG_MODE=coverage ./vendor/bin/phpunit --coverage-html coverage/html --coverage-clover coverage/clover.xml --coverage-text

  coverage-unit:
    service: appserver
    cmd: env XDEBUG_MODE=coverage ./vendor/bin/phpunit --testsuite=Unit --coverage-html coverage/html --coverage-text

  phpcs:
    service: appserver
    cmd: ./vendor/bin/phpcs --standard=phpcs.xml.dist

  phpcbf:
    service: appserver
    cmd: ./vendor/bin/phpcbf --standard=phpcs.xml.dist

  phpstan:
    service: appserver
    cmd: ./vendor/bin/phpstan analyse --configuration=phpstan.neon

  drush:
    service: appserver
    cmd: ./vendor/bin/drush

  load-test:
    service: host
    description: >
      Run k6 load test via Docker. Requires BASE_URL, QUESTION_UUID, and
      OPTION_UUID to be exported in the shell. Runs with the web dashboard
      on http://localhost:5665 and exports scripts/load-test-report.html.
    cmd: >
      docker run --rm -i
      --network host
      -e K6_WEB_DASHBOARD=true
      -e K6_WEB_DASHBOARD_OPEN=true
      -e K6_WEB_DASHBOARD_PORT=5665
      -e K6_WEB_DASHBOARD_EXPORT=/scripts/load-test-report.html
      -e BASE_URL=$BASE_URL
      -e QUESTION_UUID=$QUESTION_UUID
      -e OPTION_UUID=$OPTION_UUID
      -v $PWD/scripts:/scripts
      grafana/k6 run /scripts/k6-load-test.js
