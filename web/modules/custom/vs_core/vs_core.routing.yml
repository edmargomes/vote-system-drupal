# API — Questions
vs_core.api.questions_list:
  path: '/api/v1/questions'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Api\QuestionApiController::list'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth: ['basic_auth']

vs_core.api.question_detail:
  path: '/api/v1/questions/{uuid}'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Api\QuestionApiController::detail'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth: ['basic_auth']

# API — Vote
vs_core.api.vote:
  path: '/api/v1/questions/{uuid}/vote'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Api\VoteApiController::vote'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth: ['basic_auth']
    no_cache: true

# API — Admin results
vs_core.api.admin_results:
  path: '/api/v1/admin/questions/{uuid}/results'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Api\AdminResultsController::results'
  methods: [GET]
  requirements:
    _permission: 'administer voting'
  options:
    _auth: ['basic_auth']

# Admin — Settings
vs_core.admin.settings:
  path: '/admin/config/content/vs-core'
  defaults:
    _form: '\Drupal\vs_core\Form\VotingSettingsForm'
    _title: 'Voting System Settings'
  requirements:
    _permission: 'administer voting'
