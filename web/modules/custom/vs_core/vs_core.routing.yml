# CMS — Voting interface

vs_core.cms.question_list:
  path: '/vote'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Cms\VotingCmsController::list'
    _title: 'Vote'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'TRUE'

vs_core.cms.question_detail:
  path: '/vote/{uuid}'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Cms\VotingCmsController::detail'
    _title: 'Cast your vote'
  methods: [GET, POST]
  requirements:
    _user_is_logged_in: 'TRUE'

# API — Questions
vs_core.api.questions_list:
  path: '/api/v1/questions'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Api\QuestionApiController::list'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth: ['basic_auth']

vs_core.api.question_detail:
  path: '/api/v1/questions/{uuid}'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Api\QuestionApiController::detail'
  methods: [GET]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth: ['basic_auth']

# API — Vote
vs_core.api.vote:
  path: '/api/v1/questions/{uuid}/vote'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Api\VoteApiController::vote'
  methods: [POST]
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _auth: ['basic_auth']
    no_cache: true

# API — Admin results
vs_core.api.admin_results:
  path: '/api/v1/admin/questions/{uuid}/results'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Api\AdminResultsController::results'
  methods: [GET]
  requirements:
    _permission: 'administer voting'
  options:
    _auth: ['basic_auth']

# Admin — Questions

vs_core.admin.questions_list:
  path: '/admin/content/voting-questions'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Admin\VotingAdminController::list'
    _title: 'Voting Questions'
  methods: [GET]
  requirements:
    _permission: 'administer voting'

vs_core.admin.question_add:
  path: '/admin/content/voting-questions/add'
  defaults:
    _form: '\Drupal\vs_core\Form\VotingQuestionForm'
    _title: 'Add Voting Question'
  methods: [GET, POST]
  requirements:
    _permission: 'administer voting'

vs_core.admin.question_edit:
  path: '/admin/content/voting-questions/{id}/edit'
  defaults:
    _form: '\Drupal\vs_core\Form\VotingQuestionForm'
    _title: 'Edit Voting Question'
  methods: [GET, POST]
  requirements:
    _permission: 'administer voting'

vs_core.admin.question_delete:
  path: '/admin/content/voting-questions/{id}/delete'
  defaults:
    _form: '\Drupal\vs_core\Form\VotingQuestionDeleteForm'
    _title: 'Delete Voting Question'
  methods: [GET, POST]
  requirements:
    _permission: 'administer voting'

vs_core.admin.question_results:
  path: '/admin/content/voting-questions/{id}/results'
  defaults:
    _controller: '\Drupal\vs_core\Controller\Admin\VotingAdminController::results'
    _title: 'Results'
  methods: [GET]
  requirements:
    _permission: 'administer voting'

# Admin — Options

vs_core.admin.option_add:
  path: '/admin/content/voting-questions/{id}/options/add'
  defaults:
    _form: '\Drupal\vs_core\Form\VotingOptionForm'
    _title: 'Add Voting Option'
  methods: [GET, POST]
  requirements:
    _permission: 'administer voting'

vs_core.admin.option_edit:
  path: '/admin/content/voting-questions/{id}/options/{oid}/edit'
  defaults:
    _form: '\Drupal\vs_core\Form\VotingOptionForm'
    _title: 'Edit Voting Option'
  methods: [GET, POST]
  requirements:
    _permission: 'administer voting'

vs_core.admin.option_delete:
  path: '/admin/content/voting-questions/{id}/options/{oid}/delete'
  defaults:
    _form: '\Drupal\vs_core\Form\VotingOptionDeleteForm'
    _title: 'Delete Voting Option'
  methods: [GET, POST]
  requirements:
    _permission: 'administer voting'

# Admin — Votes

vs_core.admin.question_votes:
  path: '/admin/content/voting-questions/{id}/votes'
  defaults:
    _form: '\Drupal\vs_core\Form\VotingBulkDeleteForm'
    _title: 'Votes'
  methods: [GET, POST]
  requirements:
    _permission: 'administer voting'

# Admin — Settings
vs_core.admin.settings:
  path: '/admin/config/content/vs-core'
  defaults:
    _form: '\Drupal\vs_core\Form\VotingSettingsForm'
    _title: 'Voting System Settings'
  requirements:
    _permission: 'administer voting'
